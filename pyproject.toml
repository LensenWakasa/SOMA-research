[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "soma"
version = "0.1.0"
description = "SOMA — Self-Organising Modular Architecture for Continual Learning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Wakasa Labs", email = "wakasalabs@gmail.com"}]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "scikit-learn>=1.4.0",
    "torchvision>=0.17.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "wandb>=0.16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["soma*"]

[tool.pytest.ini_options]
testpaths = ["soma/tests"]
python_files = ["test_*.py"]
